name: 🐛 Bug report
description: Report a reproducible problem with the starter kit
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx expo run:ios`
        2. ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: iOS 18 / Android 15 / dev build / simulator
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `npx expo-env-info` (Expo SDK, RN, node, OS).
    validations:
      required: false
